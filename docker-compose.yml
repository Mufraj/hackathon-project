version: '3.8'

services:
  target-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixly-target-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - LOG_FILE=/var/log/target_app/app.log
      - NODE_ENV=production
    volumes:
      - ./logs:/var/log/target_app
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
