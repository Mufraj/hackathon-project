<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Logs Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --text: #f8fafc;
      --err: #f87171;
      --warn: #fbbf24;
      --info: #34d399;
      --panel: #1e293b;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    #status {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: bold;
      background: #dc2626;
      color: white;
    }
    #status.connected {
      background: var(--info);
      color: #064e3b;
    }
    .filters {
      margin-bottom: 15px;
    }
    .filters select {
      padding: 6px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 4px;
    }
    .log-container {
      background: var(--panel);
      border-radius: 8px;
      padding: 15px;
      height: 70vh;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .log-entry {
      padding: 8px;
      border-bottom: 1px solid #334155;
      margin-bottom: 4px;
      word-wrap: break-word;
    }
    .log-entry:last-child {
      border-bottom: none;
    }
    .log-timestamp {
      color: #94a3b8;
      margin-right: 10px;
    }
    .log-level {
      font-weight: bold;
      margin-right: 10px;
      text-transform: uppercase;
    }
    .level-error { color: var(--err); }
    .level-warn { color: var(--warn); }
    .level-info { color: var(--info); }
    
    .log-source { color: #38bdf8; margin-right: 10px; }
    .log-type { color: #c084fc; font-weight: bold; margin-right: 5px; }
    .log-message { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <h1>Live Logs Dashboard</h1>
    <div id="status">Disconnected</div>
  </header>

  <div class="filters">
    <label for="level-filter">Filter by Level: </label>
    <select id="level-filter">
      <option value="all">All</option>
      <option value="error">Error</option>
      <option value="warn">Warn</option>
      <option value="info">Info</option>
    </select>
  </div>

  <div class="log-container" id="log-container">
    <!-- Logs will appear here -->
  </div>

  <script>
    const socket = io();
    const statusEl = document.getElementById('status');
    const container = document.getElementById('log-container');
    const filter = document.getElementById('level-filter');
    
    let logs = [];

    socket.on('connect', () => {
      statusEl.textContent = '● LIVE';
      statusEl.classList.add('connected');
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'Disconnected';
      statusEl.classList.remove('connected');
    });

    socket.on('initial_logs', (initialLogs) => {
      logs = initialLogs;
      renderLogs();
    });

    socket.on('new_log', (log) => {
      logs.push(log);
      renderLogs();
    });

    filter.addEventListener('change', renderLogs);

    function renderLogs() {
      container.innerHTML = '';
      const selectedLevel = filter.value;
      
      const filteredLogs = selectedLevel === 'all' 
        ? logs 
        : logs.filter(l => l.level && l.level.toLowerCase() === selectedLevel);
        
      filteredLogs.forEach(log => {
        const div = document.createElement('div');
        div.className = 'log-entry';
        
        const safeLevel = (log.level || 'info').toLowerCase();
        const levelClass = `level-${safeLevel}`;
        const ts = log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : '';
        
        div.innerHTML = `
          <span class="log-timestamp">[${ts}]</span>
          <span class="log-level ${levelClass}">${log.level || 'INFO'}</span>
          <span class="log-source">[${log.source || 'unknown'}]</span>
          <span class="log-type">${log.type ? log.type + ':' : ''}</span>
          <span class="log-message">${escapeHtml(log.message || JSON.stringify(log))}</span>
        `;
        container.appendChild(div);
      });
      
      // Auto-scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(unsafe) {
      if (typeof unsafe !== 'string') return unsafe;
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
